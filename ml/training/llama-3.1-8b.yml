###
# Model Configuration: LLaMA 3.1 8B
###

# UPDATE: change to your preferred model (default is llama 3.1 8b)
base_model: NousResearch/Meta-Llama-3-8B

# context window for training
# UPDATE: adjust based on your message context needs (n messages * avg tokens per message)
sequence_len: 4096

# base model weight quantization
load_in_8bit: false  # disabled for multi-GPU H200 training

# attention implementation
flash_attention: true

# finetuned adapter config - LoRA for efficient training
adapter: lora
lora_model_dir:
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target_linear: true
lora_fan_in_fan_out:
lora_modules_to_save:
  - embed_tokens
  - lm_head

###
# Dataset Configuration: Text Message Prediction
###

datasets:
  # UPDATE: this path will be used when data is saved to the Volume in the cloud
  - path: data.jsonl
    ds_type: json
    type:
      system_prompt: "You are predicting the next text message based on conversation history."
      field_system: system
      field_instruction: context
      field_output: response
      # UPDATE: customize the prompt template for your task
      # this format wraps context and asks model to predict next message
      format: |-
        <|begin_of_text|><|start_header_id|>system<|end_header_id|>
        
        {system}<|eot_id|><|start_header_id|>user<|end_header_id|>
        
        {instruction}<|eot_id|><|start_header_id|>assistant<|end_header_id|>
        
        {output}<|end_of_text|>

# dataset formatting - using llama 3.1 special tokens
special_tokens:
  bos_token: "<|begin_of_text|>"
  eos_token: "<|end_of_text|>"
  pad_token: "<|end_of_text|>"

# validation split
val_set_size: 0.05

###
# Training Configuration
###

# UPDATE: adjust hyperparameters based on experimentation
# random seed for reproducibility
seed: 117

# optimizer config
optimizer: adamw_bnb_8bit
learning_rate: 0.0001
lr_scheduler: cosine
num_epochs: 1

# batch size config
# UPDATE: adjust based on GPU memory and convergence
micro_batch_size: 8
gradient_accumulation_steps: 4
warmup_steps: 5  # reduced from 10 - give more time at peak LR

# axolotl saving config
dataset_prepared_path: last_run_prepared
output_dir: ./lora-out

# logging and eval config
logging_steps: 1
eval_steps: 20  # fixed step count instead of fraction for more granular eval tracking

# training performance optimization config
bf16: auto
tf32: false
gradient_checkpointing: true

# deepspeed config for multi-GPU training (using 4x H200)
# deepspeed: /workspace/axolotl/deepspeed_configs/zero2_bf16.json  # commented out - let accelerate handle multi-GPU

###
# Weights & Biases Configuration
###

# UPDATE: set your wandb project name
wandb_project: textreme-message-prediction
wandb_entity:  # UPDATE: optionally set your wandb entity/team
wandb_name:  # will auto-generate run name if not specified
wandb_watch: gradients  # track gradient histograms
wandb_log_model: "false"  # don't upload model checkpoints to wandb (they're large)
wandb_run_id:  # will auto-generate if not specified

###
# Miscellaneous Configuration
###

# when true, prevents over-writing the config from the CLI
strict: false

# don't mess with this, it's here for accelerate and torchrun
local_rank:
