[package]
name = "imessage_query"
version = "0.1.0"
edition = "2021"
authors = ["Textreme Team"]
description = "CLI for querying iMessage chat.db and returning structured JSON"
license = "GPL-3.0-or-later"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
imessage-database = "2.8"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
rusqlite = { version = "0.36", features = ["bundled"] }
